name: Build Android v0.32 Optimized Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org com.riccardopinato --project-name edu_01 .

      - name: Download licensed anatomy assets for offline bundle
        run: |
          mkdir -p assets/anatomy
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Internal_organs.svg" -o assets/anatomy/organs.svg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Human_skeleton_(svg_template).svg" -o assets/anatomy/skeleton.svg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Muscles_front_and_back.svg" -o assets/anatomy/muscles.svg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Nervous_system_diagram_unlabeled.svg" -o assets/anatomy/nervous.svg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Circulatory_System_it.svg" -o assets/anatomy/vascular.svg
          ls -lh assets/anatomy

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run content smoke tests
        run: |
          rm -f test/widget_test.dart
          flutter test test/content_smoke_test.dart

      - name: Build universal release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols/universal
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/edu_01-v0.32.0-universal-release.apk

      - name: Build split release APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols/split
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/edu_01-v0.32.0-arm64-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/edu_01-v0.32.0-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/edu_01-v0.32.0-x86_64-release.apk

      - name: Build Play Store AAB
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/aab
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/edu_01-v0.32.0-release.aab

      - name: Verify APK signatures and report sizes
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/edu_01-v0.32.0-universal-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/edu_01-v0.32.0-arm64-release.apk
          echo "=== SIZE REPORT ==="
          ls -lh build/app/outputs/flutter-apk/edu_01-v0.32.0-*.apk
          ls -lh build/app/outputs/bundle/release/edu_01-v0.32.0-release.aab

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: edu_01-v0.32.0-universal-release-apk
          path: build/app/outputs/flutter-apk/edu_01-v0.32.0-universal-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: edu_01-v0.32.0-arm64-release-apk
          path: build/app/outputs/flutter-apk/edu_01-v0.32.0-arm64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload all split APKs
        uses: actions/upload-artifact@v4
        with:
          name: edu_01-v0.32.0-split-release-apks
          path: |
            build/app/outputs/flutter-apk/edu_01-v0.32.0-arm64-release.apk
            build/app/outputs/flutter-apk/edu_01-v0.32.0-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/edu_01-v0.32.0-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: edu_01-v0.32.0-play-store-aab
          path: build/app/outputs/bundle/release/edu_01-v0.32.0-release.aab
          if-no-files-found: error
          retention-days: 30
